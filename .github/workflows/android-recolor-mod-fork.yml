name: Open Nectar Recolor Mod (APK)

# Como usar: aba Actions -> "Open Nectar Recolor Mod (APK)" -> Run workflow.
# Quando terminar (20 a 40 minutos), o APK aparece em Releases, na pagina inicial
# deste repositorio, e tambem como "Artifact" dentro da execucao.
#
# Este workflow espera dois arquivos na RAIZ deste mesmo repositorio (o fork):
#   - pc_recolor.h            (o header C++ do mod)
#   - apply_recolor_patch.py  (o script que aplica o patch nos arquivos do jogo)
# Suba os dois via "Add file -> Upload files" no GitHub.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Baixar o codigo deste repositorio
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aplicar o mod de recolorir (Onions, Pellets, Piki, luzes, UI, paletas)
        run: |
          mkdir -p pc_port/mods
          cp pc_recolor.h pc_port/mods/pc_recolor.h
          python3 apply_recolor_patch.py

      - name: Instalar SDK, NDK e CMake do Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Compilar o APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease || ./gradlew --no-daemon assembleDebug

      - name: Localizar o APK
        id: find
        run: |
          APK="$(find android/app/build/outputs/apk -name '*.apk' | sort | head -n1)"
          test -n "$APK"
          cp "$APK" open_nectar_recolor.apk
          ls -l open_nectar_recolor.apk
          sha256sum open_nectar_recolor.apk

      - name: Guardar o APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: open_nectar_recolor
          path: open_nectar_recolor.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "recolor-${{ github.run_number }}" open_nectar_recolor.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Open Nectar Recolor #${{ github.run_number }}" \
            --notes "APK do Open Nectar com Onions, Pellets, Piki, luzes (beacon/halo/idle glow) e o painel de transferencia de Pikmin recoloridos, com paleta trocavel no menu de Mods (Recolour Mod / Recolour Palette)."
            
